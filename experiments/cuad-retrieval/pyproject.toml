[project]
name = "cucumber-cuad-retrieval"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.4.6",
  "torch==2.13.0",
  "transformers==5.16.1",
]

[project.scripts]
retrieval-bench = "retrieval_bench.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["retrieval_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
